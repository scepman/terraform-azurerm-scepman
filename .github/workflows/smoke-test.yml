name: Smoke Test

on:
  workflow_dispatch:

permissions: {}

# Never cancel a running deployment, or terraform destroy would be skipped.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Deploy Quickstart Example
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to Azure
      contents: read

    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate resource group name
        id: rg
        run: echo "name=rg-scepman-smoke-$(head -c 4 /dev/urandom | xxd -p)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: examples/quickstart
        run: terraform init

      - name: Terraform Apply
        working-directory: examples/quickstart
        env:
          LOCATION: ${{ vars.LOCATION }}
          RESOURCE_GROUP_NAME: ${{ steps.rg.outputs.name }}
        run: |
          terraform apply -auto-approve \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -var="location=${LOCATION}" \
            -var="resource_group_name=${RESOURCE_GROUP_NAME}"

      - name: Get SCEPman URL
        id: scepman
        working-directory: examples/quickstart
        run: echo "url=$(terraform output -raw scepman_url)" >> "$GITHUB_OUTPUT"

      - name: Wait for SCEPman to start
        run: sleep 60

      - name: Probe SCEPman health
        env:
          SCEPMAN_URL: ${{ steps.scepman.outputs.url }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${SCEPMAN_URL}/api/probe")
          echo "SCEPman probe returned HTTP $response"
          if [ "$response" != "200" ]; then
            echo "::error::SCEPman health probe failed with HTTP $response"
            curl -s "${SCEPMAN_URL}/api/probe" || true
            exit 1
          fi

      - name: Terraform Destroy
        if: always()
        working-directory: examples/quickstart
        env:
          LOCATION: ${{ vars.LOCATION }}
          RESOURCE_GROUP_NAME: ${{ steps.rg.outputs.name }}
        run: |
          terraform destroy -auto-approve \
            -var="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -var="location=${LOCATION}" \
            -var="resource_group_name=${RESOURCE_GROUP_NAME}" \
            -var='app_settings_primary={"AppConfig:KeyVaultConfig:RootCertificateConfig:KeyType":"RSA"}'
